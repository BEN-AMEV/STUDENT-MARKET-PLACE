<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In | CampusMarket</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 251, 247, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>

                        "on-tertiary-fixed-variant": "#7f2928",
                        "on-primary-container": "#f5fff7",
                        "on-secondary-container": "#476c5b",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "secondary": "#416656",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#a8e7cd",
                        "on-background": "#002117",
                        "on-secondary-fixed-variant": "#294e3f",
                        "on-error-container": "#93000a",
                        "surface-variant": "#b0f0d6",
                        "tertiary-container": "#ba5551",
                        "inverse-primary": "#68dba9",
                        "tertiary": "#9b3e3b",
                        "surface-container-low": "#cbffe8",
                        "outline": "#6d7a72",
                        "on-primary-fixed-variant": "#005137",
                        "primary-fixed": "#85f8c4",
                        "primary": "#059669",
                        "on-secondary-fixed": "#002115",
                        "on-primary-fixed": "#002114",
                        "surface-tint": "#059669",
                        "secondary-container": "#c3ecd7",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#3d4a42",
                        "surface-container": "#bbfbe1",
                        "outline-variant": "#bccac0",
                        "surface-container-high": "#b6f6db",
                        "surface-bright": "#e7fff3",
                        "on-error": "#ffffff",
                        "on-surface": "#002117",
                        "secondary-fixed-dim": "#a8cfbc",
                        "inverse-surface": "#003829",
                        "secondary-fixed": "#c3ecd7",
                        "surface-container-highest": "#b0f0d6",
                        "tertiary-fixed": "#ffdad7",
                        "on-primary": "#ffffff",
                        "primary-container": "#00855d",
                        "background": "#FFFBF7",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#ffffff",

                        "primary-hover": "#047857"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "44px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "container-max": "1280px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],

                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "metadata": ["12px", {"lineHeight": "1.4", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-sm": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "headline-md-mobile": ["18px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}]

                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden relative">
<!-- Atmospheric Background Effect -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary/5 rounded-full blur-[150px]"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[440px] z-10 animate-fade-in">
<!-- Identity Section -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-stack-md shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-2">CampusMarket</h1>
<p class="text-on-surface-variant font-body-lg">The secure marketplace for your university community.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface border border-border-base rounded-xl p-stack-lg shadow-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-stack-lg">Sign In</h2>
<form class="space-y-stack-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-outline uppercase" for="email">University Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full h-touch-target-min pl-11 pr-4 bg-surface border border-border-base rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-lg" id="email" placeholder="name@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-outline uppercase" for="password">Password</label>
<a class="font-metadata text-metadata text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-touch-target-min pl-11 pr-11 bg-surface border border-border-base rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-lg" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors p-1" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min bg-primary text-on-primary font-headline-sm rounded-lg hover:bg-primary-hover active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-stack-md" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg pt-stack-lg border-t border-border-base flex flex-col gap-stack-md">
<button class="w-full h-touch-target-min border border-border-base text-on-surface font-body-lg rounded-lg hover:bg-surface-container-low transition-all flex items-center justify-center gap-3">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmhdS8qeqzaH9dKg0fmPHWPhGd4m9rL28oBc6nsj9d5uhvan5VqjaX6BcOJOKLaKhG1bl9IjKpIRbwcpJU_8A7V5r5toc1oqyzxwMBNmA1x9n9-jyWVP30InFkULaecZ06mFcKvcs7Kb-Dlo5HuRD93hD5S9F33W0y6KgC0axoJIWKGQ3ma8wNfTsrfysIsdkMAticLg0RHuV1OiRzX9wlhmpWwPIdQiNDaeRft1gXAAdZE6MquGkik1H0zvE99iB8pqgx4PBbT3U"/>
<span>Continue with Student Portal (SSO)</span>
</button>
</div>
</div>
<!-- Trust Badge -->
<div class="mt-stack-lg flex flex-col items-center gap-stack-sm opacity-80">
<div class="flex items-center gap-2 px-3 py-1 bg-secondary-container/30 text-on-secondary-container rounded-full border border-secondary-container/50">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-metadata text-metadata">End-to-end encrypted &amp; .edu verified</span>
</div>
<p class="font-metadata text-metadata text-outline text-center mt-2">
                New to CampusMarket? 
                <a class="text-primary font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Footer Security Links -->
<footer class="absolute bottom-6 w-full flex justify-center gap-stack-lg text-outline font-metadata text-metadata z-10 px-margin-mobile text-center">
<a class="hover:text-on-surface-variant" href="#">Terms of Service</a>
<a class="hover:text-on-surface-variant" href="#">Privacy Policy</a>
<a class="hover:text-on-surface-variant" href="#">Cookie Settings</a>
</footer>
<script>
        // Simple Interaction Logic
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.innerText = 'visibility';
            }
        });

        // Add subtle animation delay to form elements
        const formElements = document.querySelectorAll('form > div');
        formElements.forEach((el, index) => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(10px)';
            el.style.transition = `all 0.4s ease ${0.1 + index * 0.1}s`;
            setTimeout(() => {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            }, 50);
        });
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</body></html>
